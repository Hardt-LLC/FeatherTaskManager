name: Signed Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v2026.9.1
        required: true
        type: string
      publish:
        description: Publish the verified assets to GitHub Releases
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: signed-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: windows-2025
    environment: release
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      FEATHER_SIGNING_SUBJECT: CN=HARDT, O=HARDT, L=Casper, S=Wyoming, C=US
      FEATHER_SIGNING_METADATA: ${{ github.workspace }}\installer\signing-metadata.example.json
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate tag input before checkout
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v20\d{2}\.([1-9]|1[0-2])\.([1-9]\d{0,4})$') { throw 'An explicit yyyy.m.x release tag is required.' }
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag is the checked-out main-branch commit
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Establish provenance using trusted workflow code before executing
          # any script from the selected tag.
          $head = git rev-parse --verify 'HEAD^{commit}'
          if ($LASTEXITCODE -ne 0) { throw 'HEAD could not be resolved.' }
          $tagCommit = git rev-parse --verify ('refs/tags/' + $env:RELEASE_TAG + '^{commit}')
          if ($LASTEXITCODE -ne 0 -or $head -cne $tagCommit) { throw 'Checkout does not match the exact release tag.' }
          git merge-base --is-ancestor $head refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must belong to origin/main history.' }
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'The checkout contains modified tracked files.' }
          $version = ./scripts/version.ps1
          if ($env:RELEASE_TAG -cne $version.Tag) { throw 'The selected tag does not match Cargo and PE resource versions.' }
          $commit = ./scripts/verify-release-source.ps1 -Tag $env:RELEASE_TAG
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Prepare pinned Rust and signing tools
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          rustup override set 1.98.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }
          ./scripts/prepare-release-tools.ps1
      - name: Check and test
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          ./scripts/test-release-source.ps1
          ./scripts/test-remote-release-tag.ps1
      - name: Build without signing credentials
        run: ./scripts/build.ps1
      - name: Sign and verify app, installer, and uninstaller
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: ./scripts/build-release.ps1 -SkipBuild
      - name: Save verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-${{ inputs.tag }}
          if-no-files-found: error
          path: |
            dist/FeatherTaskManager-*-Portable-x64.exe
            dist/FeatherTaskManager-*-Setup-x64.exe
            dist/FeatherTaskManager-*-Portable-x64.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      FEATHER_SIGNING_SUBJECT: CN=HARDT, O=HARDT, L=Casper, S=Wyoming, C=US
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact verified source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download only this run's signed release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-${{ inputs.tag }}
          path: dist
      - name: Publish the release after rechecking source and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ./scripts/version.ps1
          ./scripts/publish-release.ps1 -NotesFile "releases/$($version.Version).md"
